<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Fade the Chalk</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f8f8f6;
      --surface: #ffffff;
      --text: #1a1a1a;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #16a34a;
    }
    body {
      font-family: Inter, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .logo {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 32px;
    }
    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      padding: 14px 16px;
      font-size: 15px;
      font-family: Inter, sans-serif;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-input:focus { border-color: var(--text); }
    .submit-btn {
      width: 100%;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      font-family: Inter, sans-serif;
      background: var(--text);
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 8px;
    }
    .submit-btn:hover { opacity: 0.85; }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .message {
      margin-top: 16px;
      font-size: 13px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }
    .message.success {
      display: block;
      background: #f0fdf4;
      color: #16a34a;
      border: 1px solid rgba(22,163,106,0.2);
    }
    .message.error {
      display: block;
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid rgba(220,38,38,0.2);
    }
    .footer-links {
      margin-top: 24px;
      font-size: 13px;
      color: var(--muted);
    }
    .footer-links a {
      color: var(--text);
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Fade the Chalk</div>
    <p class="subtitle">Sign in with your email. We'll send you a magic link.</p>

    <form id="signin-form" onsubmit="handleSignin(event)">
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input type="email" id="email" class="form-input" placeholder="you@example.com" required />
      </div>
      <button type="submit" class="submit-btn" id="submit-btn">Send Sign-In Link</button>
    </form>

    <div id="message" class="message"></div>

    <div class="footer-links">
      <p>No account? <a href="/#join">Sign up for $99/mo</a></p>
      <p style="margin-top: 8px;"><a href="/">Back to home</a></p>
    </div>
  </div>

  <script>
    async function handleSignin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const btn = document.getElementById('submit-btn');
      const msg = document.getElementById('message');

      btn.textContent = 'Sending...';
      btn.disabled = true;
      msg.className = 'message';
      msg.style.display = 'none';

      try {
        const res = await fetch('/api/auth/send-link', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();

        if (res.ok) {
          msg.textContent = 'Check your email. We sent you a sign-in link.';
          msg.className = 'message success';
          btn.textContent = 'Link sent';
        } else {
          msg.textContent = data.error || 'Something went wrong. Try again.';
          msg.className = 'message error';
          btn.textContent = 'Send Sign-In Link';
          btn.disabled = false;
        }
      } catch (err) {
        msg.textContent = 'Network error. Check your connection.';
        msg.className = 'message error';
        btn.textContent = 'Send Sign-In Link';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>

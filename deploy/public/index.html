<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Machine — Churchill Downs 5/31</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="header__brand">
            <div>
                <h1 class="header__title">Money Machine</h1>
                <span class="header__subtitle">AI Edition</span>
            </div>
        </div>
        <div class="header__stats">
            <div class="header__stat">
                <span class="header__stat-label">Track</span>
                <span class="header__stat-value" style="font-size:0.75rem">Churchill Downs · 5/31</span>
            </div>
            <div class="header__stat">
                <span class="header__stat-label">Lifetime</span>
                <span class="header__stat-value" id="stat-lifetime">$1,057</span>
            </div>
            <div class="header__stat">
                <span class="header__stat-label">Today P/L</span>
                <span class="header__stat-value" id="stat-pl">$0</span>
            </div>
            <div class="header__stat">
                <span class="header__stat-label">ROI</span>
                <span class="header__stat-value" id="stat-roi">0%</span>
            </div>
            <div class="header__stat">
                <span class="header__stat-label">Record</span>
                <span class="header__stat-value" id="stat-record">0-0</span>
            </div>
        </div>
    </header>

    <!-- Top Nav: Views -->
    <nav class="view-nav">
        <button class="view-nav__btn view-nav__btn--active" data-view="races">Races</button>
        <button class="view-nav__btn" data-view="recap">Daily Recap</button>
        <button class="view-nav__btn" data-view="strategy">Strategy</button>
        <button class="view-nav__btn" data-view="history">History</button>
        <button class="view-nav__btn" data-view="todo">To Do</button>
    </nav>

    <!-- Race sub-nav (visible in Races view) -->
    <nav class="race-nav" id="race-nav"></nav>

    <!-- Race sub-tabs (visible when a race is selected) -->
    <nav class="race-tabs" id="race-tabs" style="display:none">
        <button class="race-tabs__btn race-tabs__btn--active" data-tab="field">Field</button>
        <button class="race-tabs__btn" data-tab="analysis">Analysis & Bets</button>
        <button class="race-tabs__btn" data-tab="signals">Signal Scoring</button>
        <button class="race-tabs__btn" data-tab="submit">Submit Bets</button>
        <button class="race-tabs__btn" data-tab="results">Results</button>
    </nav>

    <!-- Main content area -->
    <main class="main" id="main-content"></main>

    <!-- Mahoney Polaroid -->
    <div class="mahoney-polaroid">
        <div class="polaroid">
            <div class="polaroid__inner" style="aspect-ratio:4/5">
                <img src="IMG_2894.jpg" alt="Mahoney">
                <div class="polaroid__vignette"></div>
            </div>
            <div class="mahoney-polaroid__caption">
                <p>Mahoney</p>
                <p>Founder, Money Machine</p>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div class="modal" id="modal-add-row">
        <div class="modal__backdrop"></div>
        <div class="modal__content">
            <h3>Add Strategy Row</h3>
            <div class="form__field">
                <label>Signal Name</label>
                <input type="text" id="row-name" placeholder="e.g., Wet track closers">
            </div>
            <div class="form__field">
                <label>What to Look For</label>
                <input type="text" id="row-desc" placeholder="Description...">
            </div>
            <div class="form__field">
                <label>Weight (1-5)</label>
                <input type="number" id="row-weight" value="2" min="1" max="5">
            </div>
            <div class="modal__actions">
                <button class="btn btn--ghost" id="btn-cancel-row">Cancel</button>
                <button class="btn btn--accent" id="btn-save-row">Save</button>
            </div>
        </div>
    </div>

    <div class="modal" id="modal-settle">
        <div class="modal__backdrop"></div>
        <div class="modal__content modal__content--wide">
            <h3 id="settle-title">Settle Race</h3>
            <div id="settle-form"></div>
            <div class="modal__actions">
                <button class="btn btn--ghost" id="btn-cancel-settle">Cancel</button>
                <button class="btn btn--accent" id="btn-save-settle">Save Results</button>
            </div>
        </div>
    </div>

    <div class="modal" id="modal-tag">
        <div class="modal__backdrop"></div>
        <div class="modal__content">
            <h3 id="tag-title">Tag Horses</h3>
            <p class="modal__hint" id="tag-hint"></p>
            <div id="tag-horse-list"></div>
            <div class="modal__actions">
                <button class="btn btn--ghost" id="btn-cancel-tag">Cancel</button>
                <button class="btn btn--accent" id="btn-save-tag">Done</button>
            </div>
        </div>
    </div>

    <script src="races.js"></script>
    <script src="app.js"></script>
</body>
</html>
